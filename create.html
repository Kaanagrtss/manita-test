<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Soru Oluştur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #ff4d6d;
      margin-bottom: 20px;
      font-size: 24px;
    }

    label {
      font-size: 14px;
      margin-bottom: 5px;
      display: block;
      color: #444;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff335a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💖 Soru Oluştur</h1>

    <label>Soru</label>
    <input type="text" placeholder="Manitanın en sevdiği yemek ne?">

    <label>Doğru Cevap</label>
    <input type="text" placeholder="Mantı">

    <label>Yanlış Cevap 1</label>
    <input type="text" placeholder="Pizza">

    <label>Yanlış Cevap 2</label>
    <input type="text" placeholder="Hamburger">

    <button>Kaydet</button>
  </div>

</body>
</html>
