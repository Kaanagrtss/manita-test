<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Manitanı Ne Kadar Tanıyorsun?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            text-align: center;
            padding: 40px;
        }
        h1 { color: #d63384; }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
            width: 100%;
        }
        button {
            background: #d63384; color: white; border: none;
            padding: 15px 25px; font-size: 18px; border-radius: 8px;
            cursor: pointer; margin-top: 20px;
        }
        /* Gizleme Sınıfı */
        .hidden {
            display: none;
        }
        input {
            padding: 10px; width: 80%; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="home-page" class="container">
        <h1>💘 Manitanı Ne Kadar Tanıyorsun?</h1>
        <p>Sevgilin senin hakkında bir test hazırlasın,<br>sen de çöz bakalım kaç puan alacaksın 😏</p>
        <button onclick="showCreatePage()">Teste Başla</button>
    </div>

    <div id="create-page" class="container hidden">
        <h1>🛠️ Testini Oluştur</h1>
        <p>Aşağıya manitanın cevaplaması için sorularını yaz:</p>
        <input type="text" placeholder="1. Soru: En sevdiğim renk?">
        <input type="text" placeholder="2. Soru: İlk nerede tanıştık?">
        <br>
        <button onclick="alert('Test Kaydedildi!')">Testi Paylaş</button>
        <br>
        <small style="cursor:pointer; color:blue;" onclick="showHomePage()">Geri Dön</small>
    </div>

    <script>
        function showCreatePage() {
            // Giriş sayfasını gizle
            document.getElementById('home-page').classList.add('hidden');
            // Create sayfasını göster
            document.getElementById('create-page').classList.remove('hidden');
        }

        function showHomePage() {
            // Create sayfasını gizle
            document.getElementById('create-page').classList.add('hidden');
            // Giriş sayfasını göster
            document.getElementById('home-page').classList.remove('hidden');
        }
    </script>

</body>
</html>
